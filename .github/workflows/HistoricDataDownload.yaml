name: Long Sands Historic Data Download

on:
  schedule:
    - cron: '0 0 * * 5'   # Fridays
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr
            any::jsonlite
            any::data.table
            any::lubridate
            any::tidyr

      - name: Run update script
        env:
          STORMGLASS_KEY: ${{ secrets.STORMGLASS_KEY }}
        run: |
          Rscript HistoricDataRecorder.R

      - name: Commit updated data
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add Data/HistoricLongSands.csv

          git commit -m "Update historical surf data" || echo "No changes"

          git push
