name: Update Maine Surf Dashboard

on:
  schedule:
    - cron: "0 10,12,14,16,18,20,22 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1

      - name: Check secret exists
        env:
          STORMGLASS_KEY: ${{ secrets.STORMGLASS_KEY }}
        run: |
          if [ -z "$STORMGLASS_KEY" ]; then
            echo "SECRET IS EMPTY"
            exit 1
          else
            echo "SECRET EXISTS"
             echo "Length: ${#STORMGLASS_KEY}"
          fi

      - name: Render dashboard
        run: |
          Rscript -e "rmarkdown::render('index.Rmd', output_file = 'index.html')"

      - name: Commit updated dashboard
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add index.html

          git commit -m "Auto-update dashboard" || echo "No changes"

          git push
